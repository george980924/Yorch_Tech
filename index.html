<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YORCH TECH</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

/* HEADER */

header{
    text-align:center;
    background:#111;
    color:white;
    padding:15px;
}

h1{
    margin:0;
}

/* BOTÓN ADMIN */

.admin-btn{
    position:fixed;
    top:15px;
    right:15px;
    background:#ff9800;
    border:none;
    padding:10px 12px;
    border-radius:10px;
    color:white;
    cursor:pointer;
}

/* PANEL ADMIN */

.admin-panel{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.admin-box{
    background:white;
    padding:20px;
    border-radius:10px;
    width:300px;
}

.admin-box input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

/* PRODUCTOS */

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:10px;
    padding:10px;
}

.producto{
    background:white;
    border-radius:10px;
    padding:10px;
    text-align:center;
}

.producto img{
    width:100%;
    height:120px;
    object-fit:cover;
}

/* BOTÓN */

.btn{
    background:#25D366;
    color:white;
    border:none;
    width:100%;
    padding:8px;
    margin-top:5px;
}

/* CARRITO */

.carrito{
    position:fixed;
    bottom:20px;
    right:20px;
    background:black;
    color:white;
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.panel-carrito{
    position:fixed;
    bottom:70px;
    right:20px;
    width:250px;
    background:white;
    padding:10px;
    display:none;
}

</style>

</head>

<body>

<header>
<h1>YORCH TECH</h1>
</header>

<button class="admin-btn" onclick="abrirAdmin()">
⚙ Admin
</button>

<!-- PANEL ADMIN -->

<div class="admin-panel" id="admin">

<div class="admin-box">

<h3>Panel Admin</h3>

<input id="nombre" placeholder="Nombre producto">
<input id="precio" placeholder="Precio">
<input id="img" placeholder="Imagen URL">
<input id="cat" placeholder="Categoría">

<button onclick="agregarProducto()">
Agregar
</button>

<button onclick="cerrarAdmin()">
Cerrar
</button>

</div>

</div>

<!-- PRODUCTOS -->

<div class="productos" id="productos"></div>

<!-- CARRITO -->

<div class="carrito" onclick="toggleCarrito()">
🛒 <span id="count">0</span>
</div>

<div class="panel-carrito" id="carritoPanel"></div>

<script>

/* ================= DATOS ================= */

let productos = JSON.parse(localStorage.getItem("productos")) || [];

let carrito = {};

/* ================= MOSTRAR ================= */

function mostrar(){

let cont = document.getElementById("productos");

cont.innerHTML = "";

productos.forEach((p,i)=>{

cont.innerHTML += `

<div class="producto">

<img src="${p.img}">

<h4>${p.nombre}</h4>

<p>$${p.precio}</p>

<button class="btn" onclick="agregar(${i})">
Agregar
</button>

</div>

`;

});

}

mostrar();

/* ================= ADMIN ================= */

function abrirAdmin(){
document.getElementById("admin").style.display="flex";
}

function cerrarAdmin(){
document.getElementById("admin").style.display="none";
}

function agregarProducto(){

let p = {
nombre:document.getElementById("nombre").value,
precio:parseFloat(document.getElementById("precio").value),
img:document.getElementById("img").value,
cat:document.getElementById("cat").value
};

productos.push(p);

localStorage.setItem("productos",JSON.stringify(productos));

mostrar();

cerrarAdmin();

}

/* ================= CARRITO ================= */

function agregar(i){

let p = productos[i];

if(carrito[p.nombre]){

carrito[p.nombre].cantidad++;

}else{

carrito[p.nombre] = {
precio:p.precio,
cantidad:1
};

}

actualizarCarrito();

}

/* ================= MOSTRAR CARRITO ================= */

function actualizarCarrito(){

let panel = document.getElementById("carritoPanel");

panel.innerHTML = "";

let total = 0;

for(let p in carrito){

total += carrito[p].precio * carrito[p].cantidad;

panel.innerHTML += `

<p>
${p} x${carrito[p].cantidad}
</p>

`;

}

panel.innerHTML += `<hr>Total: $${total}`;

document.getElementById("count").innerText =
Object.keys(carrito).length;

localStorage.setItem("carrito",JSON.stringify(carrito));

}

/* ================= TOGGLE ================= */

function toggleCarrito(){

let p = document.getElementById("carritoPanel");

p.style.display = p.style.display=="block"?"none":"block";

}

</script>

</body>
</html>
