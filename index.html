<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YORCH TECH</title>

<style>

/* ===== GENERAL ===== */
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

/* ===== HEADER ===== */
header{
    position:relative;
    text-align:center;
}

.banner{
    width:100%;
    height:240px;
    object-fit:cover;
    filter:brightness(0.5);
}

.header-contenido{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
}

.logo{width:120px;}

.titulo{
    color:white;
    font-size:50px;
    font-weight:bold;
}

/* ===== BUSCADOR ===== */
.buscar{
    text-align:center;
    padding:20px;
}

.buscar input{
    width:85%;
    padding:12px;
    border-radius:10px;
    border:none;
}

/* ===== CATEGORÍAS ===== */
.categorias{
    text-align:center;
}

.categorias button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#ff9800;
    color:white;
    border-radius:20px;
}

/* ===== PRODUCTOS ===== */
.productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:15px;
    padding:15px;
}

.producto{
    background:white;
    border-radius:15px;
    overflow:hidden;
    position:relative;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.producto img{
    width:100%;
    height:160px;
    object-fit:cover;
}

/* FAVORITO */
.fav{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    border-radius:50%;
    width:30px;
    height:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

/* INFO */
.info-producto{
    padding:10px;
    text-align:center;
}

.precio{
    color:green;
    font-weight:bold;
}

/* CONTROLES +/- */
.controles{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin:10px 0;
}

.controles button{
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:#ff9800;
    color:white;
    cursor:pointer;
}

.cantidad{
    font-weight:bold;
}

/* BOTÓN */
.btn{
    width:100%;
    padding:10px;
    border:none;
    background:#25D366;
    color:white;
    font-weight:bold;
}

/* ===== CARRITO ===== */
.carrito-icono{
    position:fixed;
    bottom:90px;
    right:20px;
    background:black;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
}

.carrito-panel{
    position:fixed;
    bottom:140px;
    right:20px;
    width:300px;
    max-height:400px;
    overflow-y:auto;
    background:white;
    padding:10px;
    border-radius:10px;
    display:none;
}

/* ===== ADMIN ===== */
.admin-panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.admin-box{
    background:white;
    padding:20px;
    width:320px;
    border-radius:10px;
}

.admin-box input{
    width:100%;
    padding:8px;
    margin:5px 0;
}

/* ===== WHATSAPP ===== */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    text-decoration:none;
}

</style>

</head>

<body>

<header>
<img src="banner.png" class="banner">

<div class="header-contenido">
<img src="logo.png" class="logo">
<h1 class="titulo">YORCH TECH</h1>
</div>
</header>

<!-- BUSCADOR -->
<div class="buscar">
<input id="buscar" placeholder="Buscar...">
</div>

<!-- CATEGORÍAS -->
<div class="categorias">
<button onclick="filtrar('todos')">Todos</button>
<button onclick="filtrar('BMS')">BMS</button>
<button onclick="filtrar('OTROS')">OTROS</button>
</div>

<!-- PRODUCTOS -->
<div class="productos" id="productos"></div>

<!-- CARRITO -->
<div class="carrito-icono" onclick="toggleCarrito()">
🛒 <span id="contador">0</span>
</div>

<div class="carrito-panel" id="carritoPanel"></div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/5358103725">💬</a>

<!-- ADMIN -->
<button onclick="abrirAdmin()" style="position:fixed;bottom:160px;right:20px;background:#ff9800;color:white;border:none;width:50px;height:50px;border-radius:50%;">
⚙
</button>

<div class="admin-panel" id="adminPanel">
<div class="admin-box">

<h3>Admin</h3>

<input id="a_nombre" placeholder="Nombre">
<input id="a_precio" placeholder="Precio">
<input id="a_img" placeholder="Imagen">
<input id="a_cat" placeholder="Categoría">

<button onclick="agregarAdmin()" style="background:#25D366;color:white;">Agregar</button>
<button onclick="cerrarAdmin()" style="background:red;color:white;">Cerrar</button>

</div>
</div>

<script>

let productos = [];
let carrito = [];
let favoritos = {};
let cantidades = {};

function mostrar(lista){

let cont=document.getElementById("productos");
cont.innerHTML="";

lista.forEach(p=>{

if(!cantidades[p.nombre]) cantidades[p.nombre]=1;

let fav = favoritos[p.nombre] ? "❤️" : "🤍";

cont.innerHTML += `
<div class="producto">

<div class="fav" onclick="fav('${p.nombre}')">${fav}</div>

<img src="${p.imagen}">

<div class="info-producto">

<h3>${p.nombre}</h3>
<p class="precio">$${p.precio}</p>

<div class="controles">

<button onclick="cambiarCantidad('${p.nombre}',-1)">-</button>
<div class="cantidad">${cantidades[p.nombre]}</div>
<button onclick="cambiarCantidad('${p.nombre}',1)">+</button>

</div>

<button class="btn" onclick="agregar('${p.nombre}',${p.precio})">
Agregar
</button>

</div>
</div>`;
});
}

function fav(nombre){
favoritos[nombre] = !favoritos[nombre];
mostrar(productos);
}

function cambiarCantidad(nombre,delta){
cantidades[nombre] += delta;
if(cantidades[nombre]<1) cantidades[nombre]=1;
mostrar(productos);
}

function agregar(nombre,precio){

carrito.push({
nombre,
precio,
cantidad:cantidades[nombre]
});

actualizarCarrito();
}

function actualizarCarrito(){

let panel=document.getElementById("carritoPanel");
panel.innerHTML="";

let total=0;

carrito.forEach((p,i)=>{

total += p.precio*p.cantidad;

panel.innerHTML += `
<p>
${p.nombre} x${p.cantidad}
- $${p.precio*p.cantidad}
</p>`;
});

document.getElementById("contador").innerText=carrito.length;
panel.innerHTML += "<hr>Total: $"+total;
}

function toggleCarrito(){
let p=document.getElementById("carritoPanel");
p.style.display = p.style.display=="block"?"none":"block";
}

function filtrar(cat){

if(cat=="todos") return mostrar(productos);

mostrar(productos.filter(p=>p.categoria==cat));
}

function abrirAdmin(){
let pass=prompt("Clave:");
if(pass=="1234"){
document.getElementById("adminPanel").style.display="flex";
}
}

function cerrarAdmin(){
document.getElementById("adminPanel").style.display="none";
}

function agregarAdmin(){

productos.push({
nombre:a_nombre.value,
precio:+a_precio.value,
imagen:a_img.value,
categoria:a_cat.value
});

mostrar(productos);
cerrarAdmin();
}

mostrar(productos);

</script>

</body>
</html>
