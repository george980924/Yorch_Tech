<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YORCH TECH</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

/* HEADER */

header{
    position:relative;
    text-align:center;
}

.banner{
    width:100%;
    height:220px;
    object-fit:cover;
    filter:brightness(0.5);
}

.titulo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:40px;
    font-weight:bold;
}

/* BOTONES */

.topbar{
    background:#111;
    color:white;
    text-align:center;
    padding:8px;
    font-size:13px;
}

/* BUSCADOR */

.buscar{
    text-align:center;
    padding:15px;
}

.buscar input{
    width:85%;
    padding:12px;
    border-radius:10px;
    border:none;
}

/* BOTONES CATEGORÍA */

.categorias{
    text-align:center;
    margin-bottom:10px;
}

.categorias button{
    padding:8px 12px;
    margin:3px;
    border:none;
    background:#ff9800;
    color:white;
    border-radius:20px;
    cursor:pointer;
}

/* PRODUCTOS */

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
    padding:12px;
}

.producto{
    background:white;
    border-radius:15px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    position:relative;
}

.producto img{
    width:100%;
    height:140px;
    object-fit:cover;
}

.producto h3{
    font-size:14px;
}

.precio{
    color:green;
    font-weight:bold;
}

/* BOTÓN */

.btn{
    background:#25D366;
    color:white;
    border:none;
    padding:8px;
    width:100%;
    cursor:pointer;
}

/* FAVORITO */

.heart{
    position:absolute;
    top:8px;
    right:8px;
    background:white;
    border-radius:50%;
    padding:5px;
    cursor:pointer;
}

/* CARRITO */

.carrito-btn{
    position:fixed;
    bottom:90px;
    right:20px;
    background:black;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
}

.carrito{
    position:fixed;
    bottom:140px;
    right:20px;
    width:280px;
    background:white;
    border-radius:10px;
    padding:10px;
    display:none;
    box-shadow:0 0 10px rgba(0,0,0,0.3);
}

.carrito button{
    width:100%;
    margin-top:8px;
    padding:8px;
    background:orange;
    border:none;
    color:white;
}

/* WHATSAPP */

.wa{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    width:55px;
    height:55px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
}

/* SECCIÓN EXTRA */

.section-title{
    padding:10px;
    font-weight:bold;
    font-size:18px;
}

</style>

</head>

<body>

<div class="topbar">
🚚 Envíos en Holguín
</div>

<header>

<img src="banner.png" class="banner">

<div class="titulo">YORCH TECH</div>

</header>

<!-- BUSCADOR -->

<div class="buscar">
<input id="buscar" placeholder="Buscar...">
</div>

<!-- BOTONES -->

<div class="categorias">

<button onclick="filtrar('todos')">Todos</button>
<button onclick="filtrar('BMS')">BMS</button>
<button onclick="verFavoritos()">Favoritos ❤️</button>
<button onclick="verTop()">Más vendidos 🔥</button>

</div>

<!-- PRODUCTOS -->

<div class="section-title" id="tituloSeccion">Productos</div>

<div class="productos" id="productos"></div>

<!-- CARRITO -->

<div class="carrito-btn" onclick="toggleCarrito()">
🛒 <span id="contador">0</span>
</div>

<div class="carrito" id="carrito">

<h4>Tu carrito</h4>

<div id="lista"></div>

<p><b>Total: $<span id="total">0</span></b></p>

<button onclick="enviar()">Finalizar</button>

</div>

<!-- WHATSAPP -->

<a class="wa" href="https://wa.me/5358103725">💬</a>

<script src="productos.js"></script>

<script>

let carrito = {};
let favoritos = [];
let vendidos = {};

function mostrar(lista){

let cont = document.getElementById("productos");

cont.innerHTML = "";

lista.forEach(p=>{

if(!vendidos[p.nombre]) vendidos[p.nombre]=0;

cont.innerHTML += `

<div class="producto">

<div class="heart" onclick="fav('${p.nombre}')">
❤
</div>

<img src="${p.imagen}">

<h3>${p.nombre}</h3>

<p class="precio">$${p.precio}</p>

<button class="btn" onclick="agregar('${p.nombre}',${p.precio})">
Agregar
</button>

</div>

`;

});

}

mostrar(productos);

/* CARRITO INTELIGENTE */

function agregar(nombre,precio){

if(carrito[nombre]){

carrito[nombre].cantidad++;

}else{

carrito[nombre] = {precio:precio,cantidad:1};

}

vendidos[nombre]++;

actualizar();

}

/* ACTUALIZAR */

function actualizar(){

let lista = document.getElementById("lista");

lista.innerHTML = "";

let total = 0;

for(let p in carrito){

let item = carrito[p];

total += item.precio * item.cantidad;

lista.innerHTML += `

<p>

${p} x${item.cantidad}

= $${item.precio * item.cantidad}

</p>

`;

}

document.getElementById("total").innerText = total;

document.getElementById("contador").innerText =
Object.keys(carrito).length;

}

/* FAVORITOS */

function fav(nombre){

if(favoritos.includes(nombre)){

favoritos = favoritos.filter(f=>f!=nombre);

}else{

favoritos.push(nombre);

}

alert("Actualizado favoritos");

}

/* VER FAVORITOS */

function verFavoritos(){

let lista = productos.filter(p=>favoritos.includes(p.nombre));

document.getElementById("tituloSeccion").innerText = "Favoritos";

mostrar(lista);

}

/* TOP VENDIDOS */

function verTop(){

let top = productos.sort((a,b)=> (vendidos[b.nombre]||0)-(vendidos[a.nombre]||0));

document.getElementById("tituloSeccion").innerText = "Más vendidos";

mostrar(top);

}

/* FILTRO */

function filtrar(cat){

if(cat=="todos"){

document.getElementById("tituloSeccion").innerText="Productos";

mostrar(productos);

return;

}

let f = productos.filter(p=>p.categoria==cat);

mostrar(f);

}

/* CARRITO */

function toggleCarrito(){

let c = document.getElementById("carrito");

c.style.display = c.style.display=="block"?"none":"block";

}

/* BUSCAR */

document.getElementById("buscar").addEventListener("input",e=>{

let t = e.target.value.toLowerCase();

mostrar(productos.filter(p=>p.nombre.toLowerCase().includes(t)));

});

/* ENVIAR */

function enviar(){

let msg = "Pedido:%0A";

let total = 0;

for(let p in carrito){

msg += `${p} x${carrito[p].cantidad}%0A`;

total += carrito[p].precio * carrito[p].cantidad;

}

msg += `%0ATotal: $${total}`;

window.open("https://wa.me/5358103725?text="+msg);

}

</script>

</body>
</html>
