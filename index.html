<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YORCH TECH</title>

<style>

/* GENERAL */
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    scroll-behavior:smooth;
}

/* BARRA SUPERIOR */
.topbar{
    background:#111;
    color:white;
    text-align:center;
    padding:8px;
    font-size:14px;
    font-weight:bold;
}

/* HEADER */
header{
    position:relative;
    overflow:hidden;
    text-align:center;
}

.banner{
    width:100%;
    height:240px;
    object-fit:cover;
    filter:brightness(0.5);
}

.header-contenido{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
}

.logo{
    width:120px;
}

.titulo{
    color:white;
    font-size:50px;
    font-weight:900;
    letter-spacing:2px;
    margin-top:5px;
    text-shadow:0 4px 12px rgba(0,0,0,0.7);
}

/* BUSCADOR */
.buscar{
    text-align:center;
    padding:20px;
}

.buscar input{
    width:85%;
    max-width:500px;
    padding:14px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

/* CATEGORÍAS */
.categorias{
    text-align:center;
    padding-bottom:15px;
}

.categorias button{
    border:none;
    padding:10px 18px;
    margin:5px;
    border-radius:30px;
    background:#ff9800;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.categorias button:hover{
    transform:scale(1.05);
}

/* PRODUCTOS */
.productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
    padding:18px;
}

.producto{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 18px rgba(0,0,0,0.12);
    transition:0.3s;
    position:relative;
    animation:fadeIn 0.5s ease;
}

.producto:hover{
    transform:translateY(-6px);
}

.producto img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.info-producto{
    padding:12px;
    text-align:center;
}

.precio{
    color:green;
    font-weight:bold;
}

/* BOTÓN */
.btn{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:linear-gradient(45deg,#25D366,#1ebe5d);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

/* WHATSAPP */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    background:#25D366;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-decoration:none;
    color:white;
    font-size:28px;
    z-index:999;
}

/* CARRITO */
.carrito-icono{
    position:fixed;
    bottom:95px;
    right:20px;
    background:black;
    color:white;
    padding:12px 16px;
    border-radius:30px;
    cursor:pointer;
}

.carrito-panel{
    position:fixed;
    right:20px;
    bottom:150px;
    width:320px;
    max-height:430px;
    overflow-y:auto;
    background:white;
    border-radius:18px;
    padding:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    display:none;
}

/* ADMIN PANEL */
.admin-panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:2000;
}

.admin-box{
    background:white;
    padding:20px;
    width:320px;
    border-radius:15px;
}

.admin-box input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

.admin-box button{
    width:100%;
    padding:10px;
    border:none;
    margin-top:5px;
    cursor:pointer;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}

</style>

</head>

<body>

<div class="topbar">🚚 Envíos disponibles en Holguín</div>

<header>
<img src="banner.png?v=2" class="banner">

<div class="header-contenido">
<img src="logo.png?v=2" class="logo">
<h1 class="titulo">YORCH TECH</h1>
</div>
</header>

<div class="buscar">
<input id="buscar" placeholder="Buscar producto...">
</div>

<div class="categorias">
<button onclick="filtrar('todos')">Todos</button>
<button onclick="filtrar('BMS')">BMS</button>
<button onclick="filtrar('OTROS')">OTROS</button>
</div>

<div class="productos" id="productos"></div>

<div class="carrito-icono" onclick="toggleCarrito()">
🛒 <span id="contador">0</span>
</div>

<div class="carrito-panel" id="carritoPanel"></div>

<!-- ADMIN PANEL CORRECTO -->
<div class="admin-panel" id="adminPanel">
<div class="admin-box">

<h3>Admin</h3>

<input id="a_nombre" placeholder="Nombre">
<input id="a_precio" placeholder="Precio">
<input id="a_precioMayor" placeholder="Precio mayorista">
<input id="a_minMayor" placeholder="Cantidad mínima">
<input id="a_img" placeholder="Imagen">
<input id="a_cat" placeholder="Categoría">
<input id="a_info" placeholder="Info">

<button onclick="agregarAdmin()" style="background:#25D366;color:white;">
Agregar
</button>

<button onclick="cerrarAdmin()" style="background:red;color:white;">
Cerrar
</button>

</div>
</div>

<a href="https://wa.me/5358103725" class="whatsapp">💬</a>

<!-- BOTÓN ADMIN -->
<button onclick="abrirAdmin()" style="position:fixed;left:20px;bottom:90px;width:55px;height:55px;border-radius:50%;background:#ff9800;color:white;border:none;font-size:20px;">
⚙
</button>

<script src="productos.js"></script>

<script>

let telefono="5358103725";
let carrito=[];

/* MOSTRAR ADMIN */
function abrirAdmin(){
let pass = prompt("Contraseña admin:");
if(pass=="1234"){
document.getElementById("adminPanel").style.display="flex";
}else{
alert("Incorrecto");
}
}

function cerrarAdmin(){
document.getElementById("adminPanel").style.display="none";
}

function agregarAdmin(){

let nuevo={
nombre:a_nombre.value,
precio:+a_precio.value,
precioMayor:+a_precioMayor.value,
minMayor:+a_minMayor.value,
imagen:a_img.value,
categoria:a_cat.value,
info:a_info.value
};

productos.push(nuevo);

localStorage.setItem("productos",JSON.stringify(productos));

mostrar(productos);

cerrarAdmin();
}

/* MOSTRAR */
function mostrar(lista){
let cont=document.getElementById("productos");
cont.innerHTML="";

lista.forEach(p=>{
cont.innerHTML+=`
<div class="producto">
<img src="${p.imagen}">
<div class="info-producto">
<h3>${p.nombre}</h3>
<p class="precio">$${p.precio}</p>
<button class="btn">Agregar</button>
</div>
</div>`;
});
}

mostrar(productos);

</script>

</body>
</html>
