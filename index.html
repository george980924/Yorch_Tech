<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YORCH TECH</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f2f2f2;
    scroll-behavior:smooth;
}

/* HEADER */

header{
    text-align:center;
    position:relative;
    overflow:hidden;
}

header img.banner{
    width:100%;
    height:230px;
    object-fit:cover;
    filter:brightness(0.6);
}

.header-contenido{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
}

.logo{
    width:120px;
}

.titulo{
    font-size:48px;
    color:white;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 4px 10px rgba(0,0,0,0.6);
    margin-top:5px;
}

/* BUSCADOR */

.buscar{
    text-align:center;
    padding:25px 15px;
}

.buscar input{
    width:80%;
    max-width:500px;
    padding:12px;
    border:2px solid orange;
    border-radius:10px;
    outline:none;
    font-size:16px;
}

/* CATEGORÍAS */

.categorias{
    text-align:center;
    padding:10px;
}

.categorias button{
    padding:10px 18px;
    margin:5px;
    border:none;
    background:#ff9800;
    color:white;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.categorias button:hover{
    transform:scale(1.05);
}

/* PRODUCTOS */

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
    padding:15px;
}

.producto{
    background:white;
    border-radius:18px;
    padding:10px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,0.12);
    transition:0.3s;
    overflow:hidden;
}

.producto:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.producto img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:12px;
    transition:0.3s;
}

.producto img:hover{
    transform:scale(1.05);
}

.producto h3{
    margin:10px 0 5px;
}

.precio{
    color:green;
    font-weight:bold;
    margin-bottom:10px;
}

.btn{
    background:linear-gradient(45deg,#25D366,#1ebe5d);
    color:white;
    padding:10px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    margin-top:8px;
    width:100%;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.03);
}

/* WHATSAPP */

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    font-size:28px;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    z-index:999;
    transition:0.3s;
}

.whatsapp:hover{
    transform:scale(1.1);
}

/* CARRITO */

.carrito-icono{
    position:fixed;
    bottom:90px;
    right:20px;
    background:black;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
    z-index:999;
}

.carrito-panel{
    position:fixed;
    right:20px;
    bottom:140px;
    width:300px;
    max-height:420px;
    overflow-y:auto;
    background:white;
    padding:15px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
    display:none;
    z-index:1000;
}

.carrito-panel input{
    width:100%;
    padding:8px;
    margin:4px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

.carrito-panel button{
    width:100%;
    padding:10px;
    background:orange;
    border:none;
    border-radius:8px;
    margin-top:10px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.cantidad-btn{
    padding:2px 6px;
    margin:0 3px;
    cursor:pointer;
    background:#ff9800;
    color:white;
    border:none;
    border-radius:4px;
}

.eliminar-btn{
    padding:2px 6px;
    cursor:pointer;
    background:red;
    color:white;
    border:none;
    border-radius:4px;
}

/* RESPONSIVE */

@media(max-width:600px){

    .titulo{
        font-size:35px;
    }

    .productos{
        grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    }

    .carrito-panel{
        width:90%;
        right:5%;
    }

}

</style>
</head>
<body>

<!-- HEADER -->

<header>

<img src="banner.png?v=2" class="banner">

<div class="header-contenido">

<img src="logo.png?v=2" class="logo">

<h1 class="titulo">YORCH TECH</h1>

</div>

</header>

<!-- BUSCADOR -->

<div class="buscar">
<input id="buscar" placeholder="Buscar producto">
</div>

<!-- CATEGORÍAS -->

<div class="categorias">
<button onclick="filtrar('todos')">Todos</button>
<button onclick="filtrar('BMS')">BMS</button>
<button onclick="filtrar('OTROS')">OTROS</button>
</div>

<!-- PRODUCTOS -->

<div class="productos" id="productos"></div>

<!-- ICONO DEL CARRITO -->

<div class="carrito-icono" onclick="toggleCarrito()">
🛒 <span id="contador">0</span>
</div>

<!-- PANEL DEL CARRITO -->

<div class="carrito-panel" id="carritoPanel">

<h3>🛒 Tu carrito</h3>

<input id="nombre" placeholder="Nombre">
<input id="telefonoCliente" placeholder="Teléfono">
<input id="direccion" placeholder="Dirección">
<input id="referencia" placeholder="Punto de referencia">
<input id="ubicacion" placeholder="Ubicación">

<div id="listaCarrito"></div>

<p>
<strong>Total: $<span id="total">0</span></strong>
</p>

<button onclick="enviarPedido()">
Finalizar pedido
</button>

</div>

<!-- PRODUCTOS -->

<script src="productos.js"></script>

<script>

let telefono="5358103725";

let carrito=[];

/* CARGAR CARRITO */

if(localStorage.getItem("carrito")){
    carrito = JSON.parse(localStorage.getItem("carrito"));
}

/* ACTUALIZAR CONTADOR */

function actualizarContador(){
    document.getElementById("contador").innerText = carrito.length;
}

/* MOSTRAR CARRITO */

function mostrarCarrito(){

    let lista = document.getElementById("listaCarrito");

    let totalHTML = document.getElementById("total");

    lista.innerHTML = "";

    let total = 0;

    carrito.forEach((p,index)=>{

        lista.innerHTML += `
        <p>
        ${p.nombre} - $${p.precio} x ${p.cantidad}

        <button class="cantidad-btn"
        onclick="modificarCantidad(${index},1)">
        +
        </button>

        <button class="cantidad-btn"
        onclick="modificarCantidad(${index},-1)">
        -
        </button>

        <button class="eliminar-btn"
        onclick="eliminarProducto(${index})">
        ❌
        </button>

        </p>`;

        total += p.precio * p.cantidad;

    });

    totalHTML.innerText = total;

    localStorage.setItem("carrito",JSON.stringify(carrito));

}

/* TOGGLE CARRITO */

function toggleCarrito(){

    let panel=document.getElementById("carritoPanel");

    panel.style.display =
    (panel.style.display=="block")
    ? "none"
    : "block";

}

/* MOSTRAR PRODUCTOS */

function mostrar(lista){

    let cont=document.getElementById("productos");

    cont.innerHTML="";

    lista.forEach(p=>{

        cont.innerHTML += `

        <div class="producto">

            <img src="${p.imagen}">

            <h3>${p.nombre}</h3>

            <p class="precio">
            $${p.precio} - ${p.info}
            </p>

            <button class="btn"
            onclick="agregar('${p.nombre}',${p.precio})">
            Agregar
            </button>

        </div>`;

    });

}

mostrar(productos);

actualizarContador();

mostrarCarrito();

/* BUSCADOR */

document.getElementById("buscar")
.addEventListener("keyup",function(){

    let texto=this.value.toLowerCase();

    let filtrados=productos.filter(p=>
        p.nombre.toLowerCase().includes(texto)
    );

    mostrar(filtrados);

});

/* FILTRAR */

function filtrar(cat){

    if(cat=="todos"){
        mostrar(productos);
        return;
    }

    let filtrados=productos.filter(
        p=>p.categoria==cat
    );

    mostrar(filtrados);

}

/* AGREGAR PRODUCTO */

function agregar(nombre,precio){

    let cantidad=prompt("¿Cuántas unidades deseas?");

    if(cantidad==null || cantidad=="" || isNaN(cantidad)){

        alert("Cantidad inválida");

        return;

    }

    cantidad=parseInt(cantidad);

    carrito.push({
        nombre,
        precio,
        cantidad
    });

    actualizarContador();

    mostrarCarrito();

    document.getElementById("carritoPanel")
    .style.display="block";

}

/* MODIFICAR CANTIDAD */

function modificarCantidad(index,delta){

    carrito[index].cantidad += delta;

    if(carrito[index].cantidad < 1){

        carrito[index].cantidad = 1;

    }

    actualizarContador();

    mostrarCarrito();

}

/* ELIMINAR PRODUCTO */

function eliminarProducto(index){

    carrito.splice(index,1);

    actualizarContador();

    mostrarCarrito();

}

/* ENVIAR PEDIDO */

function enviarPedido(){

    if(carrito.length==0){

        alert("El carrito está vacío");

        return;

    }

    let nombre =
    document.getElementById("nombre").value;

    let tel =
    document.getElementById("telefonoCliente").value;

    let direccion =
    document.getElementById("direccion").value;

    let referencia =
    document.getElementById("referencia").value;

    let ubicacion =
    document.getElementById("ubicacion").value;

    if(nombre=="" || tel=="" || direccion==""){

        alert("Complete los datos del cliente");

        return;

    }

    let mensaje="PEDIDO:%0A%0A";

    let total=0;

    carrito.forEach(p=>{

        mensaje +=
        p.nombre+
        " x"+p.cantidad+
        " - $"+(p.precio*p.cantidad)+
        "%0A";

        total += p.precio*p.cantidad;

    });

    mensaje +=
    "%0ATotal: $"+total+
    "%0A%0ADATOS DEL CLIENTE:%0A";

    mensaje +=
    "Nombre: "+nombre+"%0A"+
    "Teléfono: "+tel+"%0A"+
    "Dirección: "+direccion+"%0A"+
    "Referencia: "+referencia+"%0A"+
    "Ubicación: "+ubicacion;

    let url=
    "https://wa.me/"+
    telefono+
    "?text="+mensaje;

    window.open(url);

    carrito=[];

    localStorage.removeItem("carrito");

    actualizarContador();

    mostrarCarrito();

    document.getElementById("carritoPanel")
    .style.display="none";

}

/* MOSTRAR DATOS */

mostrarCarrito();

</script>

<!-- BOTÓN WHATSAPP -->

<a href="https://wa.me/5358103725"
class="whatsapp"
target="_blank">

💬

</a>

</body>
</html>
