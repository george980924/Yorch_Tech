<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YORCH TECH</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2;
}

header{
    background:#111;
    color:white;
    text-align:center;
    padding:15px;
    font-weight:bold;
}

/* ADMIN */

.admin-btn{
    position:fixed;
    top:15px;
    right:15px;
    width:50px;
    height:50px;
    border-radius:50%;
    border:none;
    background:#ff9800;
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:999;
}

/* BUSCADOR */

.buscar{
    text-align:center;
    padding:15px;
}

.buscar input{
    width:90%;
    max-width:500px;
    padding:12px;
    border-radius:10px;
    border:none;
}

/* PRODUCTOS */

.productos{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:15px;
    padding:15px;
}

.producto{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
    position:relative;
}

.producto img{
    width:100%;
    height:150px;
    object-fit:cover;
}

.info{
    padding:10px;
    text-align:center;
}

.precio{
    color:green;
    font-weight:bold;
}

.mayor{
    font-size:12px;
    color:#ff9800;
}

/* BOTÓN */

.btn{
    width:100%;
    padding:10px;
    border:none;
    background:#25D366;
    color:white;
    cursor:pointer;
}

/* FAVORITOS */

.fav{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
}

/* CARRITO */

.carrito-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    background:black;
    color:white;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
}

.panel-carrito{
    position:fixed;
    bottom:80px;
    right:20px;
    width:280px;
    background:white;
    padding:10px;
    display:none;
    border-radius:10px;
}

.admin-panel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.admin-box{
    background:white;
    padding:20px;
    width:320px;
    border-radius:15px;
}

.admin-box input{
    width:100%;
    padding:10px;
    margin:5px 0;
}

</style>

</head>

<body>

<header>
YORCH TECH
</header>

<button class="admin-btn" onclick="abrirAdmin()">
⚙
</button>

<div class="buscar">
<input id="buscar" placeholder="Buscar productos...">
</div>

<div class="productos" id="productos"></div>

<div class="carrito-btn" onclick="toggleCarrito()">
🛒 <span id="contador">0</span>
</div>

<div class="panel-carrito" id="carritoPanel"></div>

<!-- ADMIN -->

<div class="admin-panel" id="adminPanel">

<div class="admin-box">

<h3>Panel Admin</h3>

<input id="nombre" placeholder="Nombre">
<input id="precio" placeholder="Precio normal">
<input id="precioMayor" placeholder="Precio mayorista">
<input id="minMayor" placeholder="Cantidad mínima">
<input id="img" placeholder="Imagen URL">
<input id="cat" placeholder="Categoría">

<button onclick="agregarProducto()" style="background:#25D366;color:white;">
Agregar
</button>

<button onclick="cerrarAdmin()" style="background:red;color:white;">
Cerrar
</button>

</div>

</div>

<script>

/* ================= DATOS ================= */

let productos = JSON.parse(localStorage.getItem("productos")) || [];
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
let favoritos = JSON.parse(localStorage.getItem("favoritos")) || [];

/* ================= MOSTRAR ================= */

function mostrar(lista = productos){

let cont = document.getElementById("productos");

cont.innerHTML = "";

lista.forEach((p,i)=>{

let f = favoritos.includes(p.nombre) ? "❤️" : "🤍";

cont.innerHTML += `

<div class="producto">

<div class="fav" onclick="fav('${p.nombre}')">${f}</div>

<img src="${p.img}">

<div class="info">

<h4>${p.nombre}</h4>

<p class="precio">$${p.precio}</p>

<p class="mayor">
Mayor: $${p.precioMayor} desde ${p.minMayor}
</p>

<button class="btn" onclick="agregar(${i})">
Agregar
</button>

</div>

</div>

`;

});

}

mostrar();

/* ================= FAVORITOS ================= */

function fav(nombre){

if(favoritos.includes(nombre)){
favoritos = favoritos.filter(f=>f!=nombre);
}else{
favoritos.push(nombre);
}

localStorage.setItem("favoritos",JSON.stringify(favoritos));

mostrar();

}

/* ================= ADMIN ================= */

function abrirAdmin(){

let pass = prompt("Contraseña admin:");

if(pass=="1234"){
document.getElementById("adminPanel").style.display="flex";
}else{
alert("Incorrecto");
}

}

function cerrarAdmin(){
document.getElementById("adminPanel").style.display="none";
}

function agregarProducto(){

let p = {
nombre:document.getElementById("nombre").value,
precio:parseFloat(document.getElementById("precio").value),
precioMayor:parseFloat(document.getElementById("precioMayor").value),
minMayor:parseInt(document.getElementById("minMayor").value),
img:document.getElementById("img").value,
cat:document.getElementById("cat").value
};

productos.push(p);

localStorage.setItem("productos",JSON.stringify(productos));

mostrar();

cerrarAdmin();

}

/* ================= CARRITO ================= */

function agregar(i){

let p = productos[i];

let e = carrito.find(x=>x.nombre==p.nombre);

if(e){
e.cantidad++;
}else{
carrito.push({
nombre:p.nombre,
precio:p.precio,
precioMayor:p.precioMayor,
minMayor:p.minMayor,
cantidad:1
});
}

localStorage.setItem("carrito",JSON.stringify(carrito));

actualizarCarrito();

}

/* ================= ACTUALIZAR ================= */

function actualizarCarrito(){

let panel = document.getElementById("carritoPanel");

panel.innerHTML = "";

let total = 0;

carrito.forEach(p=>{

let precio = p.cantidad>=p.minMayor ? p.precioMayor : p.precio;

total += precio * p.cantidad;

panel.innerHTML += `
<p>${p.nombre} x${p.cantidad} = $${precio*p.cantidad}</p>
`;

});

document.getElementById("contador").innerText = carrito.length;

panel.innerHTML += "<hr>Total: $" + total;

}

/* ================= CARRITO ================= */

function toggleCarrito(){

let p = document.getElementById("carritoPanel");

p.style.display = p.style.display=="block" ? "none" : "block";

}

/* ================= BUSCADOR (ARREGLADO) ================= */

document.getElementById("buscar").addEventListener("input",e=>{

let t = e.target.value.toLowerCase();

let filtrados = productos.filter(p =>
p.nombre.toLowerCase().includes(t)
);

mostrar(filtrados);

});

</script>

</body>
</html>
